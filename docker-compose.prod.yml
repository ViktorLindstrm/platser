services:
  db:
    image: postgis:18-3.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: platser
      POSTGRES_PASSWORD: platser
      POSTGRES_DB: platser_prod
    volumes:
      - /mnt/tank/platser/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d platser_prod"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/GITHUB_OWNER/platser:RELEASE_TAG
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PHX_SERVER: "true"
      PHX_HOST: "192.168.3.x"
      PORT: "4000"
      DATABASE_URL: "ecto://platser:platser@db/platser_prod"
      POOL_SIZE: "10"
      PLATSER_MAP_URL: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
